<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jules' Pizzeria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Jules' Pizzeria</h1>
    </header>
    <main>
        <h2>Notre Menu</h2>
        <section class="menu">
            <div class="pizza">
                <h3>Margherita</h3>
                <p>Sauce tomate, mozzarella, basilic</p>
                <p class="price">10€</p>
            </div>
            <div class="pizza">
                <h3>Pepperoni</h3>
                <p>Sauce tomate, mozzarella, pepperoni</p>
                <p class="price">12€</p>
            </div>
            <div class="pizza">
                <h3>Reine</h3>
                <p>Sauce tomate, mozzarella, jambon, champignons</p>
                <p class="price">13€</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Jules' Pizzeria</p>
    </footer>
</body>
</html>
