<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Prompt Wheel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="20" height="20">
      <strong>Prompt Wheel</strong>
    </div>
    <button id="open-wheel" class="btn btn-sm" title="Ouvrir la roue dans la page">Ouvrir la roue</button>
  </header>

  <input id="search" type="search" placeholder="Rechercher…" autocomplete="off" spellcheck="false">

  <div id="list" class="list" role="listbox" aria-label="Prompts"></div>

  <footer class="foot">
    <span id="shortcut" class="muted"></span>
    <a id="open-options" href="#">Gérer mes prompts</a>
  </footer>

  <script src="../src/defaults.js"></script>
  <script src="../src/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
